name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Analyze code
        run: flutter analyze
        continue-on-error: true  # Don't fail build if analysis has issues
      
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true
      
      - name: Run tests
        run: flutter test --coverage
        continue-on-error: true  # Don't fail build if tests fail
      
      - name: Build APK (Debug)
        run: flutter build apk --debug
      
      - name: Build APK (Release)
        run: flutter build apk --release
      
      - name: Build App Bundle (Release)
        run: flutter build appbundle --release
      
      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: shoe-store-debug-${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: shoe-store-release-${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
      
      - name: Upload App Bundle
        uses: actions/upload-artifact@v6
        with:
          name: shoe-store-bundle-${{ steps.version.outputs.version }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
      
      - name: Comment PR with build info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Build completed successfully! APK artifacts are available in the workflow run.'
            })
        continue-on-error: true
