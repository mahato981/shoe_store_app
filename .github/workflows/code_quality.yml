name: Code Quality Checks

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  quality-check:
    name: Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true
      
      - name: Analyze code
        run: flutter analyze --no-fatal-infos
      
      - name: Check for outdated dependencies
        run: flutter pub outdated
        continue-on-error: true
      
      - name: Run tests with coverage
        run: flutter test --coverage
        continue-on-error: true
      
      - name: Check code metrics
        run: |
          echo "📊 Code Statistics:"
          echo "Total Dart files: $(find lib -name '*.dart' | wc -l)"
          echo "Total lines of code: $(find lib -name '*.dart' -exec cat {} \; | wc -l)"
          echo ""
          echo "📁 Directory structure:"
          tree lib -L 2 || find lib -type d
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Code quality checks completed! Review the workflow logs for details.'
            })
        continue-on-error: true
